# ===================================================================
# Application Configuration: Campus Lost & Found
# ===================================================================
server.port=${PORT:8080}
spring.application.name=campus-lost-and-found

# ===================================================================
# Thymeleaf View Configuration
# ===================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# ===================================================================
# MySQL Database Configuration
# Environment variables:
#   SPRING_DATASOURCE_URL (defaults to local MySQL if unset)
#   DB_USERNAME (defaults to 'root' if unset)
#   DB_PASSWORD (empty default if unset, password is NEVER hardcoded)
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/campus_lost_found?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate / JPA Settings for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (Disabled for MySQL)
spring.h2.console.enabled=false

# ===================================================================
# Multipart / File Upload Settings (Max 5MB per item photo)
# ===================================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
