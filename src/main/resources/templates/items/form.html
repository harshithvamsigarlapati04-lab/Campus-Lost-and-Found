<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${formTitle} + ' | Campus Lost & Found'">Report Item</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Top Navigation Bar -->
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <!-- Flash Alerts -->
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <!-- Main Container -->
    <main class="container my-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">

                <!-- Form Header Card -->
                <div class="card border-0 shadow-sm rounded-4 mb-4 overflow-hidden">
                    <div class="p-4 text-white"
                         th:classappend="${formType == 'FOUND'} ? 'bg-success' : 'bg-danger'">
                        <div class="d-flex align-items-center">
                            <i th:if="${formType == 'FOUND'}" class="bi bi-patch-plus display-6 me-3"></i>
                            <i th:if="${formType != 'FOUND'}" class="bi bi-exclamation-triangle-fill display-6 me-3"></i>
                            <div>
                                <h3 class="fw-bold mb-1" th:text="${formTitle}">Report an Item</h3>
                                <p class="mb-0 opacity-75 small" th:text="${formSubtitle}">
                                    Fill in the details below. All records are saved permanently in MySQL.
                                </p>
                            </div>
                        </div>
                    </div>

                    <!-- Form Body -->
                    <div class="card-body p-4 p-md-5 bg-white">
                        <form th:action="@{/items/report}" th:object="${item}" method="post" enctype="multipart/form-data" novalidate>

                            <!-- Hidden ID if editing -->
                            <input type="hidden" th:field="*{id}">

                            <!-- Form Status Selector (Lost vs Found) -->
                            <div class="mb-4">
                                <label class="form-label fw-bold small text-uppercase text-secondary">
                                    Report Type <span class="text-danger">*</span>
                                </label>
                                <div class="row g-2">
                                    <div class="col-6">
                                        <input type="radio" class="btn-check" th:field="*{status}" id="statusLost" value="LOST">
                                        <label class="btn btn-outline-danger w-100 py-2 fw-semibold d-flex align-items-center justify-content-center" for="statusLost">
                                            <i class="bi bi-exclamation-circle me-2"></i> I Lost Something
                                        </label>
                                    </div>
                                    <div class="col-6">
                                        <input type="radio" class="btn-check" th:field="*{status}" id="statusFound" value="FOUND">
                                        <label class="btn btn-outline-success w-100 py-2 fw-semibold d-flex align-items-center justify-content-center" for="statusFound">
                                            <i class="bi bi-check-circle me-2"></i> I Found Something
                                        </label>
                                    </div>
                                </div>
                                <div th:if="${#fields.hasErrors('status')}" th:errors="*{status}" class="text-danger small mt-1"></div>
                            </div>

                            <hr class="text-secondary my-4 opacity-25">

                            <!-- Item Name & Category -->
                            <div class="row g-3 mb-3">
                                <div class="col-md-7">
                                    <label for="itemName" class="form-label fw-bold small text-uppercase text-secondary">
                                        Item Name / Title <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" id="itemName" th:field="*{itemName}" class="form-control form-control-lg fs-6"
                                           th:classappend="${#fields.hasErrors('itemName')} ? 'is-invalid' : ''"
                                           placeholder="e.g. Blue Dell Laptop Charger, Scientific Calculator fx-991EX">
                                    <div th:if="${#fields.hasErrors('itemName')}" th:errors="*{itemName}" class="invalid-feedback"></div>
                                </div>

                                <div class="col-md-5">
                                    <label for="category" class="form-label fw-bold small text-uppercase text-secondary">
                                        Category <span class="text-danger">*</span>
                                    </label>
                                    <select id="category" th:field="*{category}" class="form-select form-select-lg fs-6"
                                            th:classappend="${#fields.hasErrors('category')} ? 'is-invalid' : ''">
                                        <option value="">-- Choose Category --</option>
                                        <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"></option>
                                    </select>
                                    <div th:if="${#fields.hasErrors('category')}" th:errors="*{category}" class="invalid-feedback"></div>
                                </div>
                            </div>

                            <!-- Location & Date -->
                            <div class="row g-3 mb-3">
                                <div class="col-md-7">
                                    <label for="location" class="form-label fw-bold small text-uppercase text-secondary">
                                        Campus Location <span class="text-danger">*</span>
                                    </label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light text-muted"><i class="bi bi-geo-alt"></i></span>
                                        <input type="text" id="location" th:field="*{location}" class="form-control form-control-lg fs-6"
                                               th:classappend="${#fields.hasErrors('location')} ? 'is-invalid' : ''"
                                               placeholder="e.g. Central Library 2nd Floor, Room 204, Cafeteria">
                                        <div th:if="${#fields.hasErrors('location')}" th:errors="*{location}" class="invalid-feedback"></div>
                                    </div>
                                    <div class="form-text small">Where was the item lost or found?</div>
                                </div>

                                <div class="col-md-5">
                                    <label for="date" class="form-label fw-bold small text-uppercase text-secondary">
                                        Date <span class="text-danger">*</span>
                                    </label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light text-muted"><i class="bi bi-calendar-event"></i></span>
                                        <input type="date" id="date" th:field="*{date}" class="form-control form-control-lg fs-6"
                                               th:classappend="${#fields.hasErrors('date')} ? 'is-invalid' : ''">
                                        <div th:if="${#fields.hasErrors('date')}" th:errors="*{date}" class="invalid-feedback"></div>
                                    </div>
                                </div>
                            </div>

                            <!-- Contact Email -->
                            <div class="mb-3">
                                <label for="contactEmail" class="form-label fw-bold small text-uppercase text-secondary">
                                    Your Contact Email <span class="text-danger">*</span>
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                                    <input type="email" id="contactEmail" th:field="*{contactEmail}" class="form-control form-control-lg fs-6"
                                           th:classappend="${#fields.hasErrors('contactEmail')} ? 'is-invalid' : ''"
                                           placeholder="e.g. student.name@college.edu">
                                    <div th:if="${#fields.hasErrors('contactEmail')}" th:errors="*{contactEmail}" class="invalid-feedback"></div>
                                </div>
                                <div class="form-text small">Used by claimants or finders to contact you securely.</div>
                            </div>

                            <!-- Description -->
                            <div class="mb-3">
                                <label for="description" class="form-label fw-bold small text-uppercase text-secondary">
                                    Detailed Description <span class="text-danger">*</span>
                                </label>
                                <textarea id="description" th:field="*{description}" rows="4" class="form-control fs-6"
                                          th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''"
                                          placeholder="Describe key identifying marks, color, brand, stickers, unique features, or circumstances..."></textarea>
                                <div th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="invalid-feedback"></div>
                            </div>

                            <!-- Image Upload -->
                            <div class="mb-4">
                                <label for="imageFile" class="form-label fw-bold small text-uppercase text-secondary">
                                    Upload Photo <span class="text-muted fw-normal">(Optional, max 5MB)</span>
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted"><i class="bi bi-camera"></i></span>
                                    <input type="file" id="imageFile" name="image" class="form-control fs-6" accept="image/png, image/jpeg, image/webp">
                                </div>
                                <div class="form-text small">Adding a clear photo increases the chance of reuniting the item.</div>
                            </div>

                            <!-- Submission buttons -->
                            <div class="d-flex gap-3 pt-3">
                                <button type="submit" class="btn btn-lg px-4 flex-grow-1 fw-bold shadow-sm"
                                        th:classappend="${formType == 'FOUND'} ? 'btn-success' : 'btn-danger'">
                                    <i class="bi bi-check-lg me-1"></i> Submit Report
                                </button>
                                <a th:href="@{/items}" class="btn btn-outline-secondary btn-lg px-4">
                                    Cancel
                                </a>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer th:replace="~{fragments/layout :: footer}"></footer>

    <!-- Bootstrap 5 JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
